<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRM393 FE — Rust Quiz App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-title">PRM393 FE</span>
          <span class="brand-badge">Rust + Axum</span>
          <span class="brand-sub">Làm câu nào chấm ngay câu đó</span>
        </div>
        <div class="stats-bar" id="statsBar"></div>
      </div>

      <div class="topbar-row">
        <nav class="exam-tabs" id="examTabs" aria-label="Chọn bộ đề"></nav>
        <div class="toolbar-controls">
          <button type="button" class="chip-btn" id="btnViewMode" title="Đổi chế độ hiển thị">Chế độ: Từng câu</button>
          <button type="button" class="chip-btn" id="btnWrongOnly" title="Chỉ hiện các câu đã chọn sai">Câu sai (0)</button>
          <button type="button" class="chip-btn" id="btnShuffleQ" title="Xáo trộn thứ tự câu hỏi">Trộn câu</button>
          <button type="button" class="chip-btn" id="btnShuffleOpt" title="Xáo trộn vị trí đáp án A/B/C/D">Trộn đáp án</button>
          <button type="button" class="chip-btn danger" id="btnResetExam" title="Xoá kết quả đã làm của bộ đề hiện tại">Làm lại</button>
          <button type="button" class="chip-btn" id="btnTheme" title="Đổi giao diện Sáng / Tối">☾</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="questions-col" id="questionsCol"></section>

    <aside class="sidebar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Tìm từ khoá câu hỏi / đáp án..."
        autocomplete="off"
      />
      <div class="palette-title">
        <span>Danh sách câu</span>
        <span id="paletteSummary"></span>
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
      <div class="shortcut-hint" id="shortcutHint">
        Phím tắt: <b>1–4</b> hoặc <b>A–D</b> để chọn · <b>← / →</b> chuyển câu
      </div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
