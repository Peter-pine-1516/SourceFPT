[package]
name = "prm393_quiz"
version = "0.1.0"
edition = "2021"
description = "Ứng dụng luyện trắc nghiệm PRM393 FE viết bằng Rust (Axum + Serde)"

[dependencies]
# Web framework hiện đại, gọn nhẹ và an toàn kiểu của hệ sinh thái Tokio
axum = "0.7"

# Async runtime để chạy bất đồng bộ (async/await) trong Rust
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Middleware phục vụ file tĩnh (HTML, CSS, JS trong thư mục static/)
tower-http = { version = "0.5", features = ["fs"] }

# Thư viện chuẩn hoá dữ liệu JSON <-> Struct của Rust
serde = { version = "1", features = ["derive"] }
serde_json = "1"
